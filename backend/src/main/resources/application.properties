# datasource (defaults for local, overridden by docker-compose env vars)
spring.datasource.url=jdbc:mysql://localhost:3307/TSW_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.open-in-view=true

# load data.sql after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=8080

# file uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET:products}

# JWT
jwt.secret=${JWT_SECRET:zmien-ten-sekret-w-produkcji-minimum-32-znaki-dlugosci!!}
jwt.expiration=${JWT_EXPIRATION:86400000}
