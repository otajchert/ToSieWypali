# datasource (defaults for local, overridden by docker-compose env vars)
spring.datasource.url=jdbc:mysql://localhost:3306/pottery_shop?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# load data.sql after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=8080
