# Testcontainers starts a database
spring.datasource.url=jdbc:tc:mysql:8.0.46:///TSW_test?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test
spring.test.database.replace=none

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.show-sql=false

# initialize MySql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

supabase.url=http://localhost
supabase.key=test-key
supabase.bucket=test-bucket

jwt.secret=00000000000000000000000000000000
jwt.expiration=3600000
