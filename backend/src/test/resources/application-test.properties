# in-memory datasource for tests, no MySQL required
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.show-sql=false

# skip data.sql, it uses MySQL-only syntax
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

supabase.url=http://localhost
supabase.key=test-key
supabase.bucket=test-bucket

jwt.secret=test-secret-key-minimum-32-characters-long!!
jwt.expiration=3600000
